name: workout
description: "심플 운동 기록장 - Flutter 운동 기록 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  path_provider: ^2.1.6
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/app_icon/

# App Store / Play Store 아이콘 자동 생성 설정.
# `flutter create .` 로 android/ios 폴더를 만든 뒤
#   dart run flutter_launcher_icons
# 를 실행하면 assets/app_icon/icon-1024.png 하나로 모든 사이즈의
# 아이콘(iOS AppIcon.appiconset 포함)이 자동 생성됩니다.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon/icon-1024.png"
  remove_alpha_ios: true
  min_sdk_android: 21
